
name: Maths IA Cameroun - Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer Android et Web
        run: flutter create --platforms=android,web --project-name maths_ia_cameroun .

      - name: Installer les dependances
        run: flutter pub get

      - name: Verifier le code
        run: flutter analyze

      - name: Compiler APK
        run: flutter build apk --release

      - name: Compiler Web
        run: flutter build web --release

      - name: Enregistrer APK
        uses: actions/upload-artifact@v4
        with:
          name: Maths-IA-Cameroun-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Enregistrer Web
        uses: actions/upload-artifact@v4
        with:
          name: Maths-IA-Cameroun-Web
          path: build/web/
